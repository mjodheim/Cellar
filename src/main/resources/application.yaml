spring:
  application:
    name: Cellar

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

cellar:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:cellar}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      display-name: ${BOOTSTRAP_ADMIN_NAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
